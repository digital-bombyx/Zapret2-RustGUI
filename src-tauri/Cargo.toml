[package]
name = "zapret2-rustgui"
version = "0.1.1"
description = "Lightweight GUI for zapret-discord-youtube (zapret2 / winws2)"
authors = ["digital-bombyx"]
license = "MIT"
repository = "https://github.com/digital-bombyx/Zapret2-RustGUI"
edition = "2021"

[lib]
name = "zapret2_rustgui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# Управление памятью WebView2 при сворачивании (те же версии, что тянет Tauri).
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
